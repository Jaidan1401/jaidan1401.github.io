<!DOCTYPE html>

<html lang="en">
    <head>
        <title>Projects</title>
        <link rel="stylesheet" href="web.css">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
    </head>
    
    <body>
        <nav>
            <a href="index.html#overview"><span>Overview</span></a>
            <a href="index.html#projects"><span>Projects</span></a>
            <a href="index.html#skills"><span>Skills</span></a>
            <a href="index.html#connect"><span>Connect</span></a>
        </nav>
        
        <main>
            <section class="projectBack">
                <div>
                    <h1>Projects</h1>
                    <h3 id="filterText">Filter: None</h3>
                    <div class="centerFlex"><button id="resetFilter">Reset Filter</button></div>
                    <br>

                    <template id="projectTemplate">
                        <div class="projectPreview">
                            <a class="projectPreviewButton" href="">
                                <video
                                        class="projectPreviewImage"
                                        src=""
                                        muted
                                        loop
                                        playsinline
                                ></video>

                                <h3 class="projectPreviewName"></h3>
                            </a>

                            <div class="tags">
                                <button class="projectPreviewEngine">Engine</button>
                                <button class="projectPreviewLanguage">Language</button>
                                <button class="projectPreviewDimension">Dimension</button>
                            </div>
                        </div>
                    </template>

                    <div class="projectShowcasePage" id="projectShowcase">
                    </div>
                </div>
            </section>
        </main>

        <script src="projects.js"></script>
        <script src="project_display.js"></script>
    </body>
</html>
